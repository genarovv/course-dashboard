# R (#42): полный конвейер курса — 8 рёбер (решение CEO 2026-07-28) + prd→architecture
# (решение CEO 2026-07-30: обе стороны уже есть в реальных репо). Тексты 6 новых рубрик v1.0 —
# драфт агента, утверждены решением CEO 2026-07-30; смена текста = новая строка Rubric + прогон golden set.
edges:
  - source_role: jtbd
    target_role: user_story
    rubric:
      version: "1.1"
      text: >-
        Проверка связности «JTBD → user stories». B обязан опираться на A: каждая работа
        (job) из JTBD — основная, связанные и эмоциональные/социальные измерения — либо
        отражена хотя бы одной user story (синонимы и переформулировки засчитываются
        и называются), либо исключена явно (out-of-scope с обоснованием), либо потеряна.
        Story без опоры на какую-либо работу разрывом НЕ считается (это вопрос к качеству
        story, не к связности). Разрыв = не менее одной потерянной работы. Выход строго:
        ВЕРДИКТ (ok|break) / УВЕРЕННОСТЬ (high|medium|low) / СЧЁТЧИКИ (entities_checked =
        entities_found + entities_excluded + entities_lost) / ТОЧКИ (до 5: сущность |
        цитата A до 15 слов | что искал в B и почему не засчитал) / ЗАМЕТКИ до 3 строк.
  - source_role: persona
    target_role: user_story
    rubric:
      version: "1.1"
      text: >-
        Проверка связности «персоны → user stories». B обязан опираться на A: каждая
        персона с её целями, болями и ограничениями либо представлена в user stories
        (истории от её лица или явно закрывающие её потребности; синонимы засчитываются
        и называются), либо исключена явно (out-of-scope с обоснованием — например
        «персона вне целевой аудитории v1»), либо потеряна молча. Разрыв = не менее
        одной молча потерянной персоны или её ключевой боли. Выход строго: ВЕРДИКТ
        (ok|break) / УВЕРЕННОСТЬ (high|medium|low) / СЧЁТЧИКИ (entities_checked =
        entities_found + entities_excluded + entities_lost) / ТОЧКИ (до 5: сущность |
        цитата A до 15 слов | что искал в B и почему не засчитал) / ЗАМЕТКИ до 3 строк.
  - source_role: user_story
    target_role: prd
    rubric:
      version: "1.1"
      text: >-
        Проверка связности «user stories → PRD». B обязан опираться на A: каждая user
        story либо отражена в требованиях PRD (функциональное требование, бизнес-правило
        или сценарий; синонимы засчитываются и называются), либо исключена явно
        (out-of-scope с обоснованием или перенос в следующую версию), либо потеряна.
        Разрыв = не менее одной потерянной story. Выход строго: ВЕРДИКТ (ok|break) /
        УВЕРЕННОСТЬ (high|medium|low) / СЧЁТЧИКИ (entities_checked = entities_found +
        entities_excluded + entities_lost) / ТОЧКИ (до 5: сущность | цитата A до 15 слов |
        что искал в B и почему не засчитал) / ЗАМЕТКИ до 3 строк.
  - source_role: architecture
    target_role: plan
    rubric:
      version: "1.1"
      text: >-
        Проверка связности «архитектура → план разработки». B обязан опираться на A:
        каждый компонент, слой или интеграция архитектуры либо имеет задачи в плане
        (создание, настройка или доработка; синонимы засчитываются и называются), либо
        исключён явно (out-of-scope с обоснованием — например «готовый сервис, работ
        не требует»), либо потерян. Разрыв = не менее одного компонента без задач
        и без объяснения. Выход строго: ВЕРДИКТ (ok|break) / УВЕРЕННОСТЬ
        (high|medium|low) / СЧЁТЧИКИ (entities_checked = entities_found +
        entities_excluded + entities_lost) / ТОЧКИ (до 5: сущность | цитата A до 15 слов |
        что искал в B и почему не засчитал) / ЗАМЕТКИ до 3 строк.
  - source_role: plan
    target_role: code
    rubric:
      version: "1.3"   # v1.2 (решение CEO 2026-07-30 №2): B = объединение всех связок роли
      text: >-
        Проверка связности «план разработки → код». B — СПИСОК ПУТЕЙ файлов всей кодовой
        базы (объединение всех её частей: клиент, сервер и т.д.; не содержимое):
        суди по именам каталогов, модулей и файлов. Каждая задача плана
        со статусом «сделано» (или помеченная выполненной) либо имеет след в списке
        (модуль или файл по смыслу задачи; синонимы и переименования засчитываются
        и называются), либо явно помечена как отменённая/перенесённая, либо потеряна.
        Задачи со статусом «не начато» разрывом НЕ считаются. Разрыв = не менее одной
        «сделанной» задачи без следа. Выход строго: ВЕРДИКТ (ok|break) /
        УВЕРЕННОСТЬ (high|medium|low) / СЧЁТЧИКИ (entities_checked = entities_found +
        entities_excluded + entities_lost) / ТОЧКИ (до 5: сущность | цитата A до 15 слов |
        что искал в B и почему не засчитал) / ЗАМЕТКИ до 3 строк.
  - source_role: code
    target_role: tests
    rubric:
      version: "1.3"   # v1.2 (решение CEO 2026-07-30 №2): списки = объединения всех связок ролей
      text: >-
        Проверка связности «код → тесты». A и B — СПИСКИ ПУТЕЙ файлов (объединение всех
        частей кодовой и тестовой базы; не содержимое): суди по именам каталогов,
        модулей и файлов. Каждый значимый модуль кода из
        списка A либо имеет соответствующие тесты в списке B (файл теста по имени
        модуля или области; синонимы засчитываются и называются), либо явно исключён,
        либо потерян. Разрыв = не менее одного значимого модуля без следа в тестах.
        Мелкие служебные файлы (константы, стили, конфигурация) значимыми не считать.
        Выход строго: ВЕРДИКТ (ok|break) / УВЕРЕННОСТЬ (high|medium|low) / СЧЁТЧИКИ
        (entities_checked = entities_found + entities_excluded + entities_lost) /
        ТОЧКИ (до 5: сущность | цитата A до 15 слов | что искал в B и почему
        не засчитал) / ЗАМЕТКИ до 3 строк.
  - source_role: prd
    target_role: architecture
    rubric:
      version: "1.1"
      text: >-
        Проверка связности «PRD → архитектура». B обязан опираться на A: каждая значимая
        сущность PRD (роль, функциональное требование, ключевое ограничение) либо
        отражена в архитектуре (компонент, слой, механизм; синонимы засчитываются
        и называются), либо исключена явно (out-of-scope с обоснованием), либо потеряна.
        Разрыв = не менее одной потерянной значимой сущности. Выход строго: ВЕРДИКТ
        (ok|break) / УВЕРЕННОСТЬ (high|medium|low) / СЧЁТЧИКИ (entities_checked =
        entities_found + entities_excluded + entities_lost) / ТОЧКИ (до 5: сущность |
        цитата A до 15 слов | что искал в B и почему не засчитал) / ЗАМЕТКИ до 3 строк.
  - source_role: prd
    target_role: data_model
    rubric:
      version: "1.1"
      text: >-
        Проверка связности «PRD → схема данных». B обязан опираться на A: каждая значимая
        сущность PRD (роль, объект предметной области, ключевое требование к данным) либо
        отражена в схеме данных (синонимы засчитываются и называются), либо исключена явно
        (out-of-scope с обоснованием), либо потеряна. Разрыв = не менее одной потерянной
        значимой сущности. Выход строго: ВЕРДИКТ (ok|break) / УВЕРЕННОСТЬ (high|medium|low) /
        СЧЁТЧИКИ (entities_checked = entities_found + entities_excluded + entities_lost) /
        ТОЧКИ (до 5: сущность | цитата A до 15 слов | что искал в B и почему не засчитал) /
        ЗАМЕТКИ до 3 строк.
  - source_role: data_model
    target_role: architecture
    rubric:
      version: "1.1"
      text: >-
        Проверка связности «схема данных → архитектура». B обязан опираться на A: каждая
        сущность и инвариант схемы данных либо отражены в архитектуре (хранилище, слой,
        физический механизм инварианта; синонимы засчитываются и называются), либо исключены
        явно (out-of-scope с обоснованием), либо потеряны. Разрыв = не менее одной потерянной
        значимой сущности. Выход строго: ВЕРДИКТ (ok|break) / УВЕРЕННОСТЬ (high|medium|low) /
        СЧЁТЧИКИ (entities_checked = entities_found + entities_excluded + entities_lost) /
        ТОЧКИ (до 5: сущность | цитата A до 15 слов | что искал в B и почему не засчитал) /
        ЗАМЕТКИ до 3 строк.
