# v1-минимум D4: два ребра конвейера (plans/plan.md — Pre-defense расширение до 8, #42).
# + prd→architecture (решение CEO 2026-07-30): единственное ребро, у которого обе
# стороны уже есть в реальных репо, — даёт живые вердикты до сдачи схем данных.
edges:
  - source_role: prd
    target_role: architecture
    rubric:
      version: "1.0"
      text: >-
        Проверка связности «PRD → архитектура». B обязан опираться на A: каждая значимая
        сущность PRD (роль, функциональное требование, ключевое ограничение) либо
        отражена в архитектуре (компонент, слой, механизм; синонимы засчитываются
        и называются), либо исключена явно (out-of-scope с обоснованием), либо потеряна.
        Разрыв = не менее одной потерянной значимой сущности. Выход строго: ВЕРДИКТ
        (ok|break) / УВЕРЕННОСТЬ (high|medium|low) / СЧЁТЧИКИ (entities_checked =
        entities_found + entities_excluded + entities_lost) / ТОЧКИ (до 5: сущность |
        цитата A до 15 слов | что искал в B и почему не засчитал) / ЗАМЕТКИ до 3 строк.
  - source_role: prd
    target_role: data_model
    rubric:
      version: "1.0"
      text: >-
        Проверка связности «PRD → схема данных». B обязан опираться на A: каждая значимая
        сущность PRD (роль, объект предметной области, ключевое требование к данным) либо
        отражена в схеме данных (синонимы засчитываются и называются), либо исключена явно
        (out-of-scope с обоснованием), либо потеряна. Разрыв = не менее одной потерянной
        значимой сущности. Выход строго: ВЕРДИКТ (ok|break) / УВЕРЕННОСТЬ (high|medium|low) /
        СЧЁТЧИКИ (entities_checked = entities_found + entities_excluded + entities_lost) /
        ТОЧКИ (до 5: сущность | цитата A до 15 слов | что искал в B и почему не засчитал) /
        ЗАМЕТКИ до 3 строк.
  - source_role: data_model
    target_role: architecture
    rubric:
      version: "1.0"
      text: >-
        Проверка связности «схема данных → архитектура». B обязан опираться на A: каждая
        сущность и инвариант схемы данных либо отражены в архитектуре (хранилище, слой,
        физический механизм инварианта; синонимы засчитываются и называются), либо исключены
        явно (out-of-scope с обоснованием), либо потеряны. Разрыв = не менее одной потерянной
        значимой сущности. Выход строго: ВЕРДИКТ (ok|break) / УВЕРЕННОСТЬ (high|medium|low) /
        СЧЁТЧИКИ (entities_checked = entities_found + entities_excluded + entities_lost) /
        ТОЧКИ (до 5: сущность | цитата A до 15 слов | что искал в B и почему не засчитал) /
        ЗАМЕТКИ до 3 строк.
