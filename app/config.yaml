# Эталонный конфиг курса (FR-2, §3.4): источник правды для Lesson/ArtifactDef/EdgeDef/Rubric.
# Изменение = перезапуск или POST /admin/reload-config (реконсиляцию делает config_manager, ADR-005).
# Смена текста/версии рубрики = новая append-only строка Rubric + прогон golden set (CLAUDE.md).
# Паттерны артефактов — по структуре project-context-template (контракт артефактов, курсовой ADR-003).

# FR-12 (ADR-007): маркеры недель — строки-шаблоны в описаниях MR студентов
process_markers:
  - key: mutation        # неделя «Тесты» (занятия 11–12)
    pattern: "(?im)^мутация:"
  - key: prichina        # неделя «Отладка» (занятие 13) — единственный контрольный маркер
    pattern: "(?im)^причина:"
  - key: dokazatelstvo
    pattern: "(?im)^доказательство:"

# PRD FR-4 / D35: эталон для детекта заготовок — публичный репозиторий шаблона
template_repo:
  url: "https://github.com/genarovv/ai-agents-project-context"
  git_host: GitHub
  branch: main

# Пакет «12 артефактов» (решение CEO 2026-07-30, по ручному аудиту лучшей репы):
# конфиг покрывает описание курса, а не структуру демо-проекта — несколько
# паттернов на роль (шаблонный путь + реальные конвенции студентов, агрегация D1),
# мультистековые code/tests (Dart/JS/Swift, не только Python).
lessons:
  - number: 2
    title: "Контекст проекта: правила и инструкции для агентов"
    date: 2026-06-18   # подтверждена CEO 2026-07-30
    artifacts:
      - role: claude_md
        expected_pattern: "CLAUDE.md"
        # T2 (#44), узкая редакция: пробы только к объявленным требованиям курса
        content_probes:
          - key: doc_standard
            label: "раздел «Стандарт документации» (задание занятия 10)"
            contains: "Стандарт документации"
          - key: testing_standard
            label: "раздел «Стандарт тестирования» (задание занятия 11)"
            contains: "Стандарт тестирования"
          - key: debug_standard
            label: "раздел «Стандарт отладки» (задание занятия 13)"
            contains: "Стандарт отладки"
          - key: template_stub_stack
            label: "незаполненная строка стека из шаблона («Стек: <»)"
            not_contains: "Стек:\\s*<"
      - role: claude_md
        expected_pattern: "AGENTS.md"
