[project]
name = "course-dashboard"
version = "0.1.0"
description = "Dashboard преподавателя курса «Управление агентной разработкой»"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # D48 (#79): без [standard] — websockets/httptools/watchfiles кодом не
    # используются (grep 2026-08-14); --reload в dev работает встроенным StatReload
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# H1 (#52): coverage-гейт — порог применяется при запуске с --cov=app (hooks/pre-push)
[tool.coverage.report]
fail_under = 90
